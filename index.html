<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード画像ジェネレーター</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="app-kicker">Zatsucard</p>
        <h1>カード画像ジェネレーター</h1>
      </div>
      <div class="topbar-actions">
        <button id="resetBtn" class="button button-secondary" type="button">リセット</button>
        <button id="downloadAllBtn" class="button button-primary" type="button" disabled>ZIPを書き出す</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="side-pane" aria-label="カード設定">
        <section class="pane-section">
          <div class="section-heading">
            <p class="section-kicker">Source</p>
            <h2>CSV</h2>
          </div>
          <p class="section-note">1行目は見出し、1列目はタイトル、2列目以降は本文として読み込みます。</p>

          <div class="drag-drop-area" id="dragDropArea" role="button" tabindex="0">
            <div class="drag-drop-content">
              <div class="drag-drop-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M12 3v12m0-12 4 4m-4-4-4 4M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/>
                </svg>
              </div>
              <div class="drag-drop-text">
                <strong>CSVをドロップ</strong>
                <span>またはファイルを選択</span>
              </div>
            </div>
          </div>

          <div class="control-group">
            <input type="file" id="csvInput" accept=".csv">
          </div>

          <a class="button button-secondary sample-link" href="test-cards.csv" download="zatsucard-sample.csv">
            サンプルCSVをダウンロード
          </a>

          <div id="csvPreview" class="csv-preview">
            <p>CSVプレビューがここに表示されます</p>
          </div>
        </section>

        <section class="pane-section">
          <div class="section-heading">
            <p class="section-kicker">Appearance</p>
            <h2>カード</h2>
          </div>

          <div class="color-grid" aria-label="カード配色">
            <label class="color-field">
              <span>背景</span>
              <input type="color" id="bgColor" value="#ffffff">
            </label>
            <label class="color-field">
              <span>枠線</span>
              <input type="color" id="borderColor" value="#000000">
            </label>
            <label class="color-field">
              <span>タイトル</span>
              <input type="color" id="titleColor" value="#000000">
            </label>
            <label class="color-field">
              <span>本文</span>
              <input type="color" id="textColor" value="#000000">
            </label>
          </div>

          <div class="range-stack" aria-label="フォントサイズ">
            <label class="range-field">
              <span>タイトルサイズ <strong id="titleSizeValue">54px</strong></span>
              <input type="range" id="titleSize" min="16" max="64" value="54">
            </label>
            <label class="range-field">
              <span>本文サイズ <strong id="textSizeValue">40px</strong></span>
              <input type="range" id="textSize" min="12" max="54" value="40">
            </label>
          </div>
        </section>
      </aside>

      <section class="main-pane" aria-label="カードプレビュー">
        <div class="main-pane-header">
          <div>
            <p class="section-kicker">Preview</p>
            <h2>カード</h2>
            <p class="section-note">480×720px。ccfoliaの4×6グリッド向けです。</p>
          </div>
          <div class="stats" aria-label="読み込み状況">
            <div>
              <span id="cardCount">0</span>
              <small>cards</small>
            </div>
            <div>
              <span id="rowCount">0</span>
              <small>rows</small>
            </div>
          </div>
        </div>
        <div id="cardList"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <!-- アプリケーションモジュール -->
  <script src="js/config.js"></script>
  <script src="js/ui-utils.js"></script>
  <script src="js/text-renderer.js"></script>
  <script src="js/card-generator.js"></script>
  <script src="js/csv-handler.js"></script>
  <script src="js/download-manager.js"></script>
  <script src="js/drag-drop.js"></script>
  
  <script>
    // ドラッグ&ドロップ機能の初期化
    initDragAndDrop();
    
    // イベントリスナーの設定
    csvInput.addEventListener('change', handleFileUpload);
    downloadAllBtn.addEventListener('click', downloadAllCards);
    resetBtn.addEventListener('click', resetApp);
    
    // デザイン設定の変更時に再レンダリング
    [bgColor, borderColor, titleColor, textColor, titleSize, textSize].forEach(elem => {
      elem.addEventListener('input', () => {
        if (elem === titleSize) titleSizeValue.textContent = `${elem.value}px`;
        if (elem === textSize) textSizeValue.textContent = `${elem.value}px`;
        if (cardData.length > 0) generateCards(cardData);
      });
    });
    
    // アプリケーションのリセット
    function resetApp() {
      csvInput.value = '';
      resetCardData();
      
      // デザイン設定をデフォルトに戻す
      bgColor.value = '#ffffff';
      borderColor.value = '#000000';
      titleColor.value = '#000000';
      textColor.value = '#000000';
      titleSize.value = 54;
      textSize.value = 40;
      titleSizeValue.textContent = '54px';
      textSizeValue.textContent = '40px';
      
      // リセット完了のメッセージを表示
      showResetMessage();
    }
  </script>
</body>
</html>
